<!doctype html>
<html lang="en">
  <!-- Header Section -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Municipal Complaint System</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Main Content -->
  <body>
    <!-- Dashboard Wrapper -->
    <div class="dashboard-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="logo">&#x1F3DB;</div>
          <h2>Municipal</h2>
        </div>
        <nav class="sidebar-nav">
          <button class="sidebar-btn active" data-section="all">
            <span class="icon">&#x1F4CB;</span> All Complaints
          </button>
        </nav>
        <div class="sidebar-user">
          <div class="sidebar-user-info">
            <div class="sidebar-user-avatar" id="adminAvatar">A</div>
            <div>
              <div class="sidebar-user-name" id="adminNameDisplay">Admin</div>
            </div>
          </div>
          <button id="logoutBtn" class="logout-btn">Sign Out</button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <section id="allSection" class="content-section active">
          <div class="content-header">
            <h1>All Complaints</h1>
            <p>Review and respond to submitted complaints.</p>
          </div>

          <div class="search-filter-bar">
            <div class="search-box">
              <input
                type="text"
                id="adminSearchInput"
                placeholder="Search complaints..."
              />
            </div>
            <div class="filter-group">
              <label for="statusFilter">Status</label>
              <select id="statusFilter">
                <option value="">All</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="categoryFilter">Category</label>
              <select id="categoryFilter">
                <option value="">All</option>
                <option value="Water">Water</option>
                <option value="Electricity">Electricity</option>
                <option value="Roads">Roads</option>
                <option value="Sanitation">Sanitation</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div id="adminComplaintsList" class="complaints-grid"></div>
        </section>
      </main>
    </div>

    <!-- Response Modal -->
    <div id="responseModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Respond to Complaint</h3>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="complaint-details">
            <p><strong>ID:</strong> <span id="modalComplaintId"></span></p>
            <p>
              <strong>Title:</strong> <span id="modalComplaintTitle"></span>
            </p>
            <p><strong>User:</strong> <span id="modalComplaintUser"></span></p>
            <p>
              <strong>Category:</strong>
              <span id="modalComplaintCategory"></span>
            </p>
          </div>
          <div class="form-group">
            <label for="statusSelect">Status</label>
            <select id="statusSelect">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
          <div class="form-group">
            <label for="adminResponse">Response</label>
            <textarea
              id="adminResponse"
              placeholder="Write your response..."
              rows="4"
            ></textarea>
          </div>
          <button id="submitResponse" class="submit-btn">Submit</button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
  </body>
</html>
