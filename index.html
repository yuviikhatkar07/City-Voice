<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Municipal Complaint System</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="auth-wrapper">

      
      <div class="auth-left">
        <h1>Complaint <span>Management</span> System</h1>
        <p>File, track, and resolve municipal complaints in one place.</p>
        <div class="auth-features">
          <div class="auth-feature-item">
            <div class="icon">&#x1F4DD;</div>
            <span>Submit complaints directly</span>
          </div>
          <div class="auth-feature-item">
            <div class="icon">&#x1F50D;</div>
            <span>Track status in real time</span>
          </div>
          <div class="auth-feature-item">
            <div class="icon">&#x26A1;</div>
            <span>Get admin responses fast</span>
          </div>
          <div class="auth-feature-item">
            <div class="icon">&#x1F512;</div>
            <span>Your data stays secure</span>
          </div>
        </div>
      </div>

      
      <div class="auth-right">
        <div class="auth-box">
          <div class="auth-brand">
            <div class="logo">&#x1F3DB;</div>
            <h2>Municipal System</h2>
            <p>Sign in to continue</p>
          </div>

          <div class="auth-toggle">
            <button id="loginBtn" class="toggle-btn active">Login</button>
            <button id="registerBtn" class="toggle-btn">Register</button>
          </div>

          
          <form id="loginForm" class="auth-form">
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" required placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="submit" class="auth-submit-btn">Sign In</button>
            <p class="form-message" id="loginMessage"></p>
          </form>

          
          <form id="registerForm" class="auth-form hidden">
            <div class="form-group">
              <label for="registerName">Full Name</label>
              <input type="text" id="registerName" required />
            </div>
            <div class="form-group">
              <label for="registerEmail">Email</label>
              <input type="email" id="registerEmail" required placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="registerPassword">Password</label>
              <input type="password" id="registerPassword" required minlength="6" />
            </div>
            <div class="form-group">
              <label for="registerConfirmPassword">Confirm Password</label>
              <input type="password" id="registerConfirmPassword" required />
            </div>
            <button type="submit" class="auth-submit-btn">Create Account</button>
            <p class="form-message" id="registerMessage"></p>
          </form>

        </div>
      </div>

    </div>
    <script src="script.js"></script>
  </body>
</html>
